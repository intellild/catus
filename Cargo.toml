[package]
name = "catus"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.25"
async-channel = "2.5"
async-lock = "3.4"
anyhow = "1.0.101"

gpui = "0.2.2"
gpui-component = "0.5.1"
# Optional, for default bundled assets
gpui-component-assets = "0.5.1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1.89"
tracing = "0.1"

[features]
# 启用 gpui 的测试支持（TestAppContext / #[gpui::test] 等）。
# 运行测试时使用 `cargo test --features test-support`。
test-support = ["gpui/test-support"]
